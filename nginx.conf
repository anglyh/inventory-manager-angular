server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

  # Angular hashes these file names, so a new build always gets new names.
  location ~* "-[A-Z0-9]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Routes like /rooms only exist in the browser: serve the app and let Angular resolve them.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
