<div
  [attr.tabindex]="product().stock > 0 ? 0 : -1"
  class="bg-base-200 rounded-xl flex h-full w-full cursor-pointer select-none flex-col justify-between gap-4 p-4 transition-colors duration-200 hover:bg-base-300 data-[selected=true]:bg-primary data-[selected=true]:hover:bg-primary-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary motion-reduce:transition-none group"
  [attr.data-selected]="selected()"
  [class.cursor-not-allowed!]="product().stock === 0"
>
  <div class="space-y-1.5">
    <span class="text-caption font-normal text-neutral transition-colors duration-200 group-data-[selected=true]:text-primary-content/70 motion-reduce:transition-none">
      {{ product().categoryName || 'Sin categoría' }}
    </span>
    <h4 class="text-body font-medium leading-snug wrap-break-word text-base-content transition-colors duration-200 group-data-[selected=true]:text-primary-content motion-reduce:transition-none">
      {{ product().name }}
    </h4>
  </div>

  <div class="flex flex-wrap items-center justify-between gap-2 border-t border-base-300 pt-3 transition-colors duration-200 group-hover:border-base-content/15 group-data-[selected=true]:border-primary-content/20 group-data-[selected=true]:group-hover:border-primary-content/20 motion-reduce:transition-none">
    <div class="text-subtitle font-semibold tracking-tight whitespace-nowrap text-base-content tabular-nums transition-colors duration-200 group-data-[selected=true]:text-primary-content motion-reduce:transition-none">
      <span class="text-caption font-medium text-neutral transition-colors duration-200 group-data-[selected=true]:text-primary-content/70 motion-reduce:transition-none">S/. </span>
      <span class="font-medium">{{ product().salePrice }}</span>
    </div>

    <span
      class="text-caption whitespace-nowrap tabular-nums transition-colors duration-200 group-data-[selected=true]:text-primary-content/70 motion-reduce:transition-none font-medium"
      [class.text-warning]="product().stock === 0"
      [class.text-neutral]="product().stock !== 0"
    >
     {{ product().stock === 0 ? 'Sin stock' : `Disponible: ${product().stock}` }}
    </span>
  </div>
</div>
