<form class="flex flex-col gap-4 rounded-box bg-base-100 p-4 sm:p-6" [formGroup]="form" (ngSubmit)="submit()" aria-labelledby="new-user-title">
  <h2 id="new-user-title" class="text-subtitle font-medium">Nuevo empleado</h2>

  <label class="flex flex-col gap-1">
    <span class="text-caption text-neutral">Nombre</span>
    <input class="input w-full" type="text" formControlName="name" maxlength="50" autocomplete="off" placeholder="Ej.: Juan Pérez" />
    @if (formUtils.isInvalidField(form, 'name')) {
      <app-form-error-label [control]="form.controls.name" />
    }
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-caption text-neutral">Correo</span>
    <input class="input w-full" type="email" formControlName="email" maxlength="100" autocomplete="off" placeholder="juan@ejemplo.com" />
    @if (formUtils.isInvalidField(form, 'email')) {
      <app-form-error-label [control]="form.controls.email" />
    }
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-caption text-neutral">Contraseña</span>
    <span class="input w-full">
      <input [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="new-password" />
      <button type="button" class="flex shrink-0 cursor-pointer p-1 text-neutral hover:text-base-content" (click)="showPassword.set(!showPassword())" aria-label="Mostrar u ocultar contraseña">
        <ng-icon [name]="showPassword() ? 'tablerEyeOff' : 'tablerEye'" size="18" aria-hidden="true" />
      </button>
    </span>
    <small class="text-neutral">Mínimo 12 caracteres y una mayúscula.</small>
    @if (formUtils.isInvalidField(form, 'password')) {
      <app-form-error-label [control]="form.controls.password" />
    }
  </label>

  @if (error()) {
    <p class="text-caption text-error" role="alert">{{ error() }}</p>
  }

  <app-button type="submit" [loading]="saving()" [disabled]="saving()">
    Crear empleado
  </app-button>
</form>
