<app-modal label="Cobrar" boxClass="max-w-md" [isOpen]="open()" (closed)="closed.emit()">
  <form class="flex flex-col gap-5" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="flex flex-col gap-1">
      <div class="flex items-baseline justify-between gap-3">
        <h3 class="text-subtitle font-medium">Cobrar</h3>
        <span class="font-medium text-warning tabular-nums">Debe S/ {{ balance() | number: '1.2-2' }}</span>
      </div>
      <small class="text-neutral">El pago entra a la caja abierta.</small>
    </div>

    <app-segmented-control
      class="w-full"
      label="Método de pago"
      [fill]="true"
      [options]="paymentOptions"
      [value]="method()"
      (valueChange)="setMethod($event)"
    />

    <label class="flex flex-col gap-1">
      <span class="text-caption text-neutral">Monto que paga</span>
      <span class="input w-full" [class.input-error]="exceeds() || (submitAttempted() && form.controls.amount.invalid)">
        <span class="text-neutral">S/</span>
        <input class="tabular-nums" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" formControlName="amount" />
      </span>
      @if (exceeds()) {
        <small class="text-error">Es más de lo que debe.</small>
      } @else {
        <small class="text-neutral">Puede pagar solo una parte.</small>
      }
    </label>

    @if (error()) {
      <div role="alert" class="flex items-start gap-2 rounded-field bg-error-soft px-3 py-2 text-error whitespace-pre-line">
        <ng-icon class="mt-0.5 shrink-0" name="tablerAlertCircle" size="18" aria-hidden="true" />
        <small>{{ error() }}</small>
      </div>
    }

    <div class="flex justify-end gap-2">
      <app-button type="button" variant="ghost" [disabled]="saving()" (click)="cancelled.emit()">Cancelar</app-button>
      <app-button type="submit" variant="primary" [loading]="saving()" [disabled]="saving() || exceeds()">Cobrar</app-button>
    </div>
  </form>
</app-modal>
