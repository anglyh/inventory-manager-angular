<app-modal boxClass="max-w-md" [label]="title()" [isOpen]="open()" (closed)="closed.emit()">
  <div class="flex flex-col gap-5">
    <div class="flex flex-col gap-1">
      <h3 class="text-subtitle font-medium">{{ title() }}</h3>
      @if (!error()) {
        <p class="text-neutral">{{ hint() }}</p>
      }
    </div>

    @if (error()) {
      <div role="alert" class="flex items-start gap-2 rounded-field bg-error-soft px-3 py-2 text-error">
        <ng-icon class="mt-0.5 shrink-0" name="tablerAlertCircle" size="18" aria-hidden="true" />
        <small>{{ error() }}</small>
      </div>
    }

    <div class="flex flex-wrap justify-end gap-2">
      <app-button variant="ghost" [disabled]="busy()" (click)="cancelled.emit()">Cancelar</app-button>
      @if (error() && alternativeLabel()) {
        <app-button variant="primary" [loading]="busy()" [disabled]="busy()" (click)="alternative.emit()">
          {{ alternativeLabel() }}
        </app-button>
      } @else if (!error()) {
        <app-button variant="error" [loading]="busy()" [disabled]="busy()" (click)="confirmed.emit()">Eliminar</app-button>
      }
    </div>
  </div>
</app-modal>
