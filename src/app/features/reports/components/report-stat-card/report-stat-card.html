@let p = parts();
@let d = deltaView();
<div
  class="stats h-full w-full overflow-hidden"
  [class]="isPrimary() ? 'bg-primary text-primary-content' : 'bg-base-100'"
  [style.animation-delay.ms]="delay()"
>
  <div class="stat gap-y-1 px-4 py-3 sm:px-5 sm:py-4">
    <div class="flex min-w-0 items-center justify-between gap-2">
      <div class="stat-title truncate" [class.text-primary-content]="isPrimary()" [class.opacity-80]="isPrimary()">{{ label() }}</div>
      @if (d) {
        <span
          class="badge badge-sm shrink-0 whitespace-nowrap border-0 px-1.5 font-medium tabular-nums"
          [class]="isPrimary() ? 'bg-primary-content/15 text-primary-content' : d.good ? 'bg-success-soft text-success' : 'bg-error-soft text-error'"
          [attr.aria-label]="'Variación ' + d.arrow + ' ' + d.text"
        >
          {{ d.arrow }}{{ d.text }}
        </span>
      }
    </div>
    <div
      class="stat-value font-semibold tracking-tight tabular-nums"
      [class]="valueSize()"
      [class.text-error]="(tone() === 'danger' && +value() > 0) || (p.negative && !isPrimary())"
    >
      @if (p.negative) {<span>−</span>}
      @if (format() === 'money') {<span class="mr-0.5 text-[0.5em] font-medium opacity-60">S/</span>}
      {{ p.int }}@if (p.dec !== null) {<span class="text-[0.55em] opacity-60">.{{ p.dec }}</span>}@if (format() === 'percent') {<span class="ml-0.5 text-[0.55em] opacity-60">%</span>}
    </div>
    @if (hint()) {
      <div class="stat-desc truncate" [class.text-primary-content]="isPrimary()" [class.opacity-75]="isPrimary()">{{ hint() }}</div>
    }
  </div>
</div>
