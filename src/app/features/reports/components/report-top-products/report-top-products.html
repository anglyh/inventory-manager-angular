<section class="grid gap-6 rounded-box bg-base-100 p-5 sm:grid-cols-2">
  <div class="flex flex-col gap-3">
    <h2 class="font-medium">Más vendidos</h2>
    <ng-container *ngTemplateOutlet="ranking; context: { $implicit: soldRows(), money: false }" />
  </div>
  <div class="flex flex-col gap-3">
    <h2 class="font-medium">Más ganancia</h2>
    <ng-container *ngTemplateOutlet="ranking; context: { $implicit: profitRows(), money: true }" />
  </div>
</section>

<ng-template #ranking let-rows let-money="money">
  @if (rows.length) {
    <ol class="flex flex-col gap-3">
      @for (row of rows; track row.id; let i = $index) {
        <li class="flex flex-col gap-1">
          <div class="flex items-baseline justify-between gap-3">
            <span class="min-w-0 truncate"><span class="text-neutral tabular-nums">{{ i + 1 }}.</span> {{ row.name }}</span>
            <span class="shrink-0 font-medium tabular-nums">
              @if (money) {
                S/ {{ row.value | number: '1.2-2' }}
              } @else {
                {{ row.value }} und.
              }
            </span>
          </div>
          <div class="h-1.5 overflow-hidden rounded-full bg-base-200">
            <div class="h-full rounded-full bg-primary" [style.width.%]="row.share"></div>
          </div>
        </li>
      }
    </ol>
  } @else {
    <p class="py-6 text-center text-sm text-neutral">Sin ventas en el período</p>
  }
</ng-template>
