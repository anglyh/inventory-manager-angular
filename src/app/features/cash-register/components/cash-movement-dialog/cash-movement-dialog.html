<app-modal label="Registrar movimiento" boxClass="max-w-md" [isOpen]="open()" (closed)="closed.emit()">
  <form class="flex flex-col gap-5" [formGroup]="form" (ngSubmit)="onSubmit()">
    <h3 class="text-subtitle font-medium">Movimiento de efectivo</h3>

    <div class="flex gap-1 rounded-field bg-base-200 p-1" role="tablist" aria-label="Tipo de movimiento">
      <button
        type="button"
        role="tab"
        class="btn btn-sm flex-1 border-0 shadow-none"
        [class]="type() === 'CASH_IN' ? 'bg-base-100' : 'btn-ghost text-neutral'"
        [attr.aria-selected]="type() === 'CASH_IN'"
        (click)="setType('CASH_IN')"
      >
        Aporte
      </button>
      <button
        type="button"
        role="tab"
        class="btn btn-sm flex-1 border-0 shadow-none"
        [class]="type() === 'CASH_OUT' ? 'bg-base-100' : 'btn-ghost text-neutral'"
        [attr.aria-selected]="type() === 'CASH_OUT'"
        (click)="setType('CASH_OUT')"
      >
        Retiro
      </button>
    </div>

    <label class="flex flex-col gap-1">
      <span class="text-caption text-neutral">Importe</span>
      <span class="input w-full" [class.input-error]="amountError || isExcessWithdrawal()">
        <span class="text-neutral">S/</span>
        <input
          class="tabular-nums"
          type="number"
          inputmode="decimal"
          min="0.01"
          step="0.01"
          placeholder="0.00"
          formControlName="amount"
          [attr.aria-invalid]="!!amountError"
        />
      </span>
      @if (amountError) {
        <small class="text-error">{{ amountError }}</small>
      } @else if (isExcessWithdrawal()) {
        <small class="text-error">Excede el efectivo disponible en gaveta.</small>
      }
    </label>

    <label class="flex flex-col gap-1">
      <span class="flex justify-between text-caption text-neutral">
        Motivo
        <span class="tabular-nums">{{ form.controls.reason.value.length }}/{{ reasonMaxLength }}</span>
      </span>
      <input
        class="input w-full"
        type="text"
        placeholder="Ej.: cambio en monedas"
        formControlName="reason"
        [attr.maxlength]="reasonMaxLength"
        [class.input-error]="!!reasonError"
        [attr.aria-invalid]="!!reasonError"
      />
      @if (reasonError) {
        <small class="text-error">{{ reasonError }}</small>
      }
    </label>

    <div class="flex flex-wrap gap-2">
      @for (preset of presets(); track preset) {
        <button type="button" class="btn btn-xs rounded-full border-0 bg-base-200 font-normal" (click)="setReason(preset)">
          {{ preset }}
        </button>
      }
    </div>

    @if (error()) {
      <div role="alert" class="flex items-start gap-2 rounded-field bg-error/10 px-3 py-2 text-error">
        <ng-icon class="mt-0.5 shrink-0" name="tablerAlertCircle" size="18" aria-hidden="true" />
        <small>{{ error() }}</small>
      </div>
    }

    <div class="flex justify-end gap-2">
      <app-button type="button" variant="ghost" [disabled]="saving()" (click)="cancelled.emit()">Cancelar</app-button>
      <app-button type="submit" variant="primary" [loading]="saving()" [disabled]="saving() || isExcessWithdrawal()">
        Registrar
      </app-button>
    </div>
  </form>
</app-modal>
