<dl class="flex flex-col">
  @for (row of rows(); track row.key) {
    @let v = view(row);
    <div
      class="flex items-center gap-3"
      [class]="row.total ? 'mt-2 rounded-field bg-base-200/60 px-3 py-3' : 'py-2'"
    >
      <dt class="flex min-w-0 flex-1 items-center gap-3">
        <span class="grid size-9 shrink-0 place-items-center rounded-field" [class]="v.tile" aria-hidden="true">
          <ng-icon [name]="v.icon" size="18" />
        </span>
        <span class="min-w-0 wrap-break-word" [class]="row.total ? 'font-semibold' : 'text-neutral'">{{ row.label }}</span>
      </dt>
      <dd
        class="shrink-0 whitespace-nowrap tabular-nums"
        [class]="row.total ? 'text-subtitle font-semibold' : 'font-medium ' + v.amount"
      >
        @if (row.sign) {
          <span aria-hidden="true">{{ row.sign }}</span>
          <span class="sr-only">{{ row.sign === '+' ? 'más' : 'menos' }}</span>
        }
        S/ {{ row.value | number: '1.2-2' }}
      </dd>
    </div>
  }
</dl>
