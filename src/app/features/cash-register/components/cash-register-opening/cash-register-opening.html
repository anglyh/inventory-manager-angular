<form
  class="flex flex-col gap-6 rounded-box bg-base-100 p-4 sm:p-6"
  [formGroup]="form"
  (ngSubmit)="submit()"
  aria-labelledby="opening-title"
>
  <div class="flex items-center justify-between gap-3">
    <div class="flex items-center gap-2">
      <span class="size-2 rounded-full bg-neutral/40" aria-hidden="true"></span>
      <h2 id="opening-title" class="text-subtitle font-medium">Caja cerrada</h2>
    </div>
    <a class="btn btn-ghost" routerLink="/cash-register/history" aria-label="Historial de cajas">
      <ng-icon name="tablerHistory" size="20" aria-hidden="true" />
      <span class="hidden sm:inline">Historial</span>
    </a>
  </div>

  <div class="grid gap-6 lg:grid-cols-2">
    <div class="flex flex-col gap-3">
      <label class="flex flex-col gap-1">
        <span class="text-caption text-neutral">Fondo inicial</span>
        <span class="input input-lg w-full" [class.input-error]="!!amountError">
          <span class="text-neutral">S/</span>
          <input
            class="tabular-nums"
            type="number"
            inputmode="decimal"
            min="0"
            step="0.01"
            placeholder="0.00"
            formControlName="openingAmount"
            [attr.aria-invalid]="!!amountError"
          />
        </span>
        @if (amountError) {
          <small class="text-error" role="alert">{{ amountError }}</small>
        }
      </label>

      <div class="flex flex-wrap gap-2" aria-label="Montos sugeridos">
        @for (preset of presets; track preset) {
          <button
            type="button"
            class="btn btn-sm rounded-full border-0"
            [class]="amount() === preset ? 'btn-primary' : 'bg-base-200'"
            (click)="setPreset(preset)"
          >
            S/ {{ preset }}
          </button>
        }
      </div>
    </div>

    <label class="flex flex-col gap-1">
      <span class="flex justify-between text-caption text-neutral">
        Observación (opcional)
        <span class="tabular-nums">{{ form.controls.notes.value.length }}/{{ notesMaxLength }}</span>
      </span>
      <textarea
        class="textarea w-full flex-1 resize-none"
        rows="3"
        placeholder="Ej.: fondo entregado por administración"
        formControlName="notes"
        [attr.maxlength]="notesMaxLength"
      ></textarea>
    </label>
  </div>

  <div class="flex justify-end">
    <app-button
      type="submit"
      size="lg"
      customClass="w-full sm:w-auto"
      [disabled]="busy()"
      [loading]="busy()"
    >
      Abrir caja
    </app-button>
  </div>
</form>
