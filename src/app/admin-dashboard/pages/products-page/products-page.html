<div class="flex flex-col gap-4">
  <app-module-tabs label="Secciones de productos" [tabs]="moduleTabs" />

  <section class="flex flex-col gap-4 rounded-box bg-base-100 p-4 sm:p-5" aria-label="Productos">
    <div class="flex flex-col gap-3 md:flex-row md:items-start md:justify-between">
      <!-- Buscador, filtro y categorías elegidas (chips con ✕): fluyen y bajan de línea si no entran. -->
      <div class="flex min-w-0 flex-1 flex-wrap items-center gap-2">
        <search-product-form class="w-full md:max-w-80" />
        <category-multiselect-filter
          [categories]="categories()"
          [selected]="selectedCategoryIds()"
          (selectedChange)="onCategoryChange($event)"
        />
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <!-- Solo existe la vista de tabla; el selector queda listo para sumar otras (p. ej. tarjetas). -->
        <div class="dropdown dropdown-end">
          <button type="button" class="btn gap-2 border-0 bg-base-200 font-normal shadow-none" aria-label="Vista">
            <ng-icon name="tablerTable" size="18" aria-hidden="true" />
            Tabla
            <ng-icon name="tablerChevronDown" size="16" aria-hidden="true" />
          </button>
          <ul tabindex="-1" class="dropdown-content menu z-10 mt-2 w-40 rounded-box bg-base-100 p-1 shadow-lg">
            <li>
              <button type="button" class="menu-active">
                <ng-icon name="tablerTable" size="16" aria-hidden="true" />
                Tabla
              </button>
            </li>
          </ul>
        </div>

        @if (isAdmin()) {
          <app-button customClass="w-full md:w-auto" (click)="openNewProduct()">
            <ng-icon name="tablerPlus" size="18" aria-hidden="true" />
            Nuevo producto
          </app-button>
        }
      </div>
    </div>

    <product-table
      [products]="productResource.value()?.data ?? []"
      [loading]="productResource.isLoading()"
      [editable]="isAdmin()"
      (edit)="openModal($event)"
    />
  </section>

  <footer class="flex flex-col-reverse items-center justify-between gap-3 sm:flex-row">
    <div class="flex items-center gap-2 text-neutral">
      Mostrar
      <!-- Dropdown propio: la lista de un <select> nativo la dibuja el sistema y no acepta estilos. -->
      <div class="dropdown dropdown-top">
        <button type="button" class="btn gap-1 border-0 bg-base-100 font-normal tabular-nums shadow-none" aria-label="Productos por página">
          {{ productsPerPage() }}
          <ng-icon name="tablerChevronDown" size="14" aria-hidden="true" />
        </button>
        <ul tabindex="-1" class="dropdown-content menu z-10 mb-1 w-20 rounded-box bg-base-100 p-1 shadow-lg">
          @for (size of pageSizes; track size) {
            <li>
              <button
                type="button"
                class="tabular-nums"
                [class.menu-active]="size === productsPerPage()"
                (click)="changePageSize(size); blurActive()"
              >
                {{ size }}
              </button>
            </li>
          }
        </ul>
      </div>
      por página
    </div>

    <app-pagination [pages]="productResource.value()?.totalPages ?? 0" [currentPage]="paginationService.currentPage()" />
  </footer>
</div>

<!-- product-form-modal -->
<app-modal (closed)="closeModal()" [isOpen]="isModalOpen()">
  <product-form
    [productInitialData]="selectedProduct()"
    (onSuccess)="closeModal(); productResource.reload()"
    (onCancel)="closeModal()"
  />
</app-modal>
