@if (productsResource.isLoading() || suppliersResource.isLoading()) {
  <div class="grid h-full place-items-center" role="status" aria-label="Cargando">
    <span class="loading loading-spinner loading-xl text-primary"></span>
  </div>
} @else if (productsResource.error()) {
  <div class="grid h-full place-items-center gap-3">
    <p class="text-neutral">No se pudieron cargar los productos.</p>
    <app-button (click)="productsResource.reload()">Reintentar</app-button>
  </div>
} @else {
  <purchase-form
    [products]="productsResource.value() ?? []"
    [suppliers]="suppliersResource.hasValue() ? suppliersResource.value() : []"
    [saving]="saving()"
    [creatingSupplier]="creatingSupplier()"
    [supplierError]="supplierError()"
    [createdSupplier]="createdSupplier()"
    (submitted)="registerPurchase($event)"
    (supplierCreateRequested)="createSupplier($event)"
  />
}
