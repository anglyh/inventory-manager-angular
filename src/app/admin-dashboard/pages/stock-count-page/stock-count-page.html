@if (!productsResource.hasValue() && productsResource.isLoading()) {
  <div class="grid flex-1 place-items-center" role="status" aria-label="Cargando">
    <span class="loading loading-spinner loading-xl text-primary"></span>
  </div>
} @else if (!productsResource.hasValue()) {
  <div class="grid flex-1 place-items-center content-center gap-3">
    <p class="text-neutral">No se pudieron cargar los productos.</p>
    <app-button (click)="productsResource.reload()">Reintentar</app-button>
  </div>
} @else {
  <stock-count-form
    class="flex-1"
    [products]="productsResource.value()"
    [saving]="saving()"
    (submitted)="registerCount($event)"
  />
}
