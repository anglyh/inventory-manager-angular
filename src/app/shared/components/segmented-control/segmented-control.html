@for (option of options(); track option.value) {
  <button
    type="button"
    role="radio"
    class="btn min-w-0 shrink rounded-full border-0 px-2 shadow-none sm:px-4"
    [class]="option.value === value() ? 'btn-primary' : 'btn-ghost font-normal text-neutral'"
    [class.flex-1]="fill()"
    [attr.aria-checked]="option.value === value()"
    [title]="option.title ?? ''"
    (click)="valueChange.emit(option.value)"
  >
    <span class="truncate">{{ option.label }}</span>
  </button>
}
