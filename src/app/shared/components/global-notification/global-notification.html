@if (state().visible) {
  <div
    class="notification fixed inset-x-4 top-[max(1rem,env(safe-area-inset-top))] z-60 flex max-h-[calc(100dvh-2rem)] items-start gap-3 overflow-y-auto rounded-xl p-4 text-notification-content shadow-notification sm:left-auto sm:right-6 sm:top-6 sm:w-96"
    animate.enter="notification-enter"
    animate.leave="notification-leave"
    [class.bg-notification-success]="state().type === 'success'"
    [class.bg-notification-error]="state().type === 'error'"
  >
    <div class="flex size-10 shrink-0 items-center justify-center rounded-full bg-notification-content/15">
      <ng-icon
        [name]="state().type === 'error' ? 'tablerAlertCircle' : 'tablerCircleCheck'"
        size="24"
      />
    </div>
    <div class="min-w-0 flex-1 space-y-1 wrap-break-word">
      <p class="text-body font-semibold">{{ state().type === 'error' ? 'Error' : 'Listo' }}</p>
      <p class="whitespace-pre-line text-body text-notification-content/90">{{ state().message }}</p>
    </div>
  </div>
}
