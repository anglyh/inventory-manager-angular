# Included in every location: an add_header inside a location drops the server-level ones.
# TLS ends at Traefik; browsers still honor HSTS because they only see the HTTPS response.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The barcode scanner needs the camera; nothing else is requested.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
